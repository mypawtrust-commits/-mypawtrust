<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>My Connection | MyPawTrust Buyer Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="nav-component.js"></script>
</head>
<body class="bg-slate-50 pt-24 font-sans text-slate-800">
    <main class="max-w-4xl mx-auto px-6 py-20 text-center">
        <header class="mb-20">
            <h2 class="text-5xl font-black text-indigo-950 italic mb-4">Elite Guest Registry.</h2>
            <p class="text-slate-400 uppercase text-xs font-bold tracking-[0.4em]">Dedicated Support for Registered MyPawTrust Families</p>
        </header>

        <div class="bg-white p-12 rounded-[4rem] shadow-2xl border border-slate-50 text-left">
            <h4 class="text-2xl font-black mb-8 italic">Find My Reservation</h4>
            <p class="text-slate-500 mb-8 text-sm leading-relaxed italic">Once your application has been verified and your companion is reserved, your private digital legacy account will be activated here.</p>
            
            <div class="space-y-6">
                <input type="text" placeholder="Reservation Access Key" class="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-4 focus:ring-indigo-100 tracking-[1em] text-center font-black">
                <button class="w-full bg-indigo-950 text-white py-5 rounded-[2.5rem] font-black uppercase tracking-widest text-xs">Unlock Secure Portal</button>
                <div class="grid grid-cols-2 gap-4">
                     <button onclick="location.href='tracking.html'" class="p-4 bg-slate-50 text-slate-400 font-bold uppercase text-[9px] rounded-xl tracking-widest hover:text-indigo-600 transition-colors underline decoration-2 underline-offset-4">Check Delivery Tracking</button>
                     <button onclick="location.href='insurance.html'" class="p-4 bg-slate-50 text-slate-400 font-bold uppercase text-[9px] rounded-xl tracking-widest hover:text-indigo-600 transition-colors underline decoration-2 underline-offset-4">Apply for Medical Claim</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
