<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Essentials | MyPawTrust Verified Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #010409; color: white; overflow-x: hidden; }
        .hero-font { font-family: 'Playfair Display', serif; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-32 relative">

    <nav class="p-8 border-b border-white/5 flex justify-between items-center bg-black/50 backdrop-blur-md sticky top-0 z-40">
        <div onclick="location.href='index.html'" class="flex items-center gap-3 cursor-pointer group hover:opacity-80 transition-all">
            <span class="text-2xl">🔙</span>
            <div class="leading-none">
                <h1 class="font-black italic text-xl tracking-tighter uppercase">MyPawTrust</h1>
                <p class="text-[8px] text-emerald-500 uppercase tracking-[0.3em]">Return to Hub</p>
            </div>
        </div>
        <div class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-500 border border-slate-800 px-4 py-2 rounded-full">
            Curated Essentials
        </div>
    </nav>

    <main class="max-w-[1200px] mx-auto px-6 py-20 relative z-10">
        <header class="mb-24 text-center">
            <span class="text-emerald-500 text-[10px] font-black uppercase tracking-[0.4em] mb-4 block italic">Verified Equipment</span>
            <h2 class="text-5xl md:text-7xl font-black italic hero-font tracking-tighter uppercase mb-6">The Boutique.</h2>
            <p class="text-slate-400 text-sm max-w-2xl mx-auto font-light leading-relaxed">Protect your investment. We have curated a mandatory selection of the finest nutrition, grooming, and habitat essentials required for a heritage feline.</p>
        </header>

        <!-- 雷达抓取的陈列区 -->
        <div id="shop-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="col-span-full text-center">
                <div class="loader"></div>
                <p class="text-slate-500 text-[9px] tracking-[0.3em] uppercase mt-4">Unlocking Premium Essentials...</p>
            </div>
        </div>
    </main>

    <script>
        const PROJECT_ID = 'dpnrwrvyixpditytorcf';
        const supabaseUrl = `https://${PROJECT_ID}.supabase.co`;
        const supabaseKey = 'sb_publishable_-depQZkB_gomwvYWa5sYGQ_IfymhyvK';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchProducts() {
            try {
                const { data: products, error } = await _supabase.from('recommended_products').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const container = document.getElementById('shop-grid');
                let htmlContent = '';

                if (products && products.length > 0) {
                    products.forEach((prod, index) => {
                        htmlContent += `
                        <div class="bg-[#050810] border border-white/5 p-8 rounded-3xl shadow-xl flex flex-col md:flex-row gap-8 items-center group transition-all hover:border-emerald-500/40">
                            
                            <div class="w-full md:w-1/3 bg-white p-4 rounded-2xl">
                                <img src="${prod.product_image || 'logo.png'}" class="w-full h-32 object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-500">
                            </div>
                            
                            <div class="w-full md:w-2/3 flex flex-col h-full justify-between text-left">
                                <div>
                                    <span class="bg-emerald-900/30 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest inline-block mb-3">${prod.target_age || 'Essential'}</span>
                                    <h3 class="text-xl font-black text-white mb-2 leading-tight">${prod.product_name || 'Premium Item'}</h3>
                                    <p class="text-slate-400 text-xs leading-relaxed italic border-l-2 border-emerald-900 pl-3">" ${prod.expert_advice || 'Highly recommended by our breeding council.'} "</p>
                                </div>
                                
                                <div class="mt-6 pt-4 border-t border-white/5">
                                    <a href="${prod.affiliate_link || '#'}" target="_blank" class="inline-block w-full text-center bg-emerald-600 text-white px-6 py-3 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-white hover:text-emerald-900 transition-colors">Acquire on Amazon →</a>
                                </div>
                            </div>

                        </div>
                        `;
                    });
                } else {
                    htmlContent = '<div class="col-span-full text-center py-20 text-slate-500 font-bold uppercase tracking-widest">Boutique currently restocking...</div>';
                }

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('shop-grid').innerHTML = '<div class="col-span-full text-center py-20 text-red-500 font-bold uppercase tracking-widest">System Error: Vault Disconnected.</div>';
            }
        }
        window.onload = fetchProducts;
    </script>
</body>
</html>
