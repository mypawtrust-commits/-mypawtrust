<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Boutique Logistics Station | MPT Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #010409; color: #e6edf3; font-family: 'Inter', sans-serif; }
        .ship-card { background: rgba(13, 17, 23, 0.95); border: 2px solid #30363d; border-radius: 2.5rem; padding: 2rem; }
        .mpt-input { background: #010409 !important; border: 1px solid #30363d !important; color: white !important; padding: 12px; border-radius: 12px; font-size: 11px; width:100%; margin-bottom: 12px; }
        .badge-live { color: #238636; background: rgba(35, 134, 54, 0.1); padding: 2px 10px; border-radius: 99px; border: 1px solid rgba(35, 134, 54, 0.4); font-size: 8px; font-weight: 900; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-16 border-b border-slate-800 pb-10">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase">Logistics <span class="text-indigo-500">Dispatch</span></h1>
                <p class="text-slate-500 text-[10px] mt-1 font-bold uppercase tracking-[0.2em]">Verified Fulfillment for Premium Breeders</p>
            </div>
            <button onclick="location.href='index.html'" class="text-xs font-bold text-slate-500 border border-slate-700 px-4 py-2 rounded-xl hover:text-white transition-all">Exit Station</button>
        </header>

        <!-- 管理与打标区 -->
        <div id="active-shipments" class="grid grid-cols-1 gap-6">
             <!-- 这里的订单列表会自动弹出，让卖家点“发货” -->
             <p class="text-center py-20 text-slate-700 animate-pulse font-black uppercase text-xs">Waiting for active client reservations...</p>
        </div>
    </div>

    <!-- 弹窗：发货控制器 -->
    <div id="ship-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="ship-card max-w-lg w-full relative">
            <h3 class="text-2xl font-black italic mb-6">Manifest Finalization</h3>
            
            <div class="space-y-4">
                <input id="modal_order_id" type="hidden">
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-500 ml-2">Choose Trusted Carrier</label>
                    <select id="modal_courier" class="mpt-input mt-2">
                        <option value="CitizenShipper">Independent Elite Driver (CitizenShipper)</option>
                        <option value="Flight Nanny">MPT Authorized Flight Nanny</option>
                        <option value="Delta Cargo">Delta PetSafe / Expedited Air</option>
                        <option value="UPS Express">UPS 1-Day (Care Kits Only)</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-500 ml-2">Generated Tracking ID</label>
                    <input id="modal_track" type="text" placeholder="e.g. MPT-FL123-TX" class="mpt-input">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[9px] font-black uppercase text-slate-500 ml-2 text-center">ETD (Estimated Hand-off)</label><input id="modal_date" type="date" class="mpt-input"></div>
                    <div>
                        <label class="text-[9px] font-black uppercase text-slate-500 ml-2 text-center">Packing Label</label>
                        <button onclick="mockPrintLabel()" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-[10px] font-black text-indigo-400">📄 PREVIEW PDF</button>
                    </div>
                </div>

                <button onclick="commitDispatch()" class="w-full bg-indigo-600 py-6 rounded-[2rem] font-black text-xs uppercase shadow-xl hover:bg-indigo-500 transition-all">Submit & Alert Buyer</button>
                <button onclick="document.getElementById('ship-modal').classList.add('hidden')" class="w-full mt-4 text-slate-600 text-[10px] uppercase font-bold tracking-widest">Cancel Dispatch</button>
            </div>
        </div>
    </div>

    <script>
        const PROJECT_ID = 'dpnrwrvyixpditytorcf';
        const supabaseUrl = `https://${PROJECT_ID}.supabase.co`;
        const supabaseKey = 'sb_publishable_-depQZkB_gomwvYWa5sYGQ_IfymhyvK';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadShipmentOrders() {
            // 只寻找那些已经咨询或者预定的买家单子
            const { data: ords } = await _supabase.from('orders').select('*').order('id', {ascending:false});
            if(!ords) return;

            document.getElementById('active-shipments').innerHTML = ords.map(o => `
                <div class="bg-[#0d1117] p-8 rounded-[3rem] border border-slate-800 shadow-sm flex flex-col md:flex-row justify-between items-center group">
                    <div>
                        <div class="flex items-center gap-3 mb-4">
                             <span class="badge-live uppercase tracking-widest">${o.logistics_status || 'Waiting'}</span>
                             <p class="text-xs font-bold text-slate-400 italic">Pet ID: #${o.pet_id}</p>
                        </div>
                        <h4 class="text-2xl font-black italic tracking-tighter uppercase text-white">${o.buyer_name}</h4>
                        <p class="text-xs font-mono text-indigo-400 underline mt-1">${o.buyer_contact}</p>
                    </div>
                    
                    <div class="mt-8 md:mt-0 flex gap-4">
                        <div class="text-right">
                             <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Route Mapping</p>
                             <p class="text-xs text-white italic font-bold">Inquiry Hub: ${o.status || 'Verified Domestic'}</p>
                        </div>
                        <button onclick="openDispatcher(${o.id})" class="bg-white text-indigo-900 px-8 py-4 rounded-2xl font-black text-xs uppercase hover:bg-indigo-600 hover:text-white transition-all shadow-xl">
                            Prepare Logistics →
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openDispatcher(id) {
            document.getElementById('modal_order_id').value = id;
            document.getElementById('ship-modal').classList.remove('hidden');
        }

        async function commitDispatch() {
            const id = document.getElementById('modal_order_id').value;
            const data = {
                courier_name: document.getElementById('modal_courier').value,
                tracking_number: document.getElementById('modal_track').value,
                estimated_arrival: document.getElementById('modal_date').value,
                logistics_status: 'Departed Hub - In Transit'
            };

            const { error } = await _supabase.from('orders').update(data).eq('id', id);
            if(!error) {
                alert("✨ MANIFEST BROADCAST SUCCESSFUL. Buyer is now tracking live!");
                location.reload();
            }
        }

        function mockPrintLabel() {
            // 这个动作可以弹出新页面生成一个PDF或打印
            alert("Official MyPawTrust Shipping Label Generating... \n\n Ensure thermal printer is calibrated for Boutique Specs.");
        }

        window.onload = loadShipmentOrders;
    </script>
</body>
</html>
