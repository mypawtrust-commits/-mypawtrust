<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry Portal | MyPawTrust VIP 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #010409; color: white; overflow-x: hidden; }
        .hero-font { font-family: 'Playfair Display', serif; }
        
        /* 终端扫描光晕动画 */
        .scanner-line {
            width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #6366f1, transparent);
            position: absolute; top: 0; left: 0; opacity: 0.5;
            animation: scan 3s infinite ease-in-out;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-6">

    <!-- 背景气氛组：暗黑放射光晕 -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_#1e1b4b_0%,_#010409_60%)] opacity-50 z-0"></div>

    <!-- 左上角返回撤退点 -->
    <div onclick="location.href='index.html'" class="absolute top-8 left-8 z-50 flex items-center gap-3 cursor-pointer group hover:opacity-80 transition-all">
        <span class="text-2xl text-indigo-500 group-hover:-translate-x-2 transition-transform">🔙</span>
        <span class="text-[9px] text-indigo-400 uppercase tracking-[0.3em] font-black italic">Abort & Return</span>
    </div>

    <!-- 核心鉴权终端卡片 -->
    <main class="w-full max-w-lg relative z-10">
        
        <!-- 卡片主体 -->
        <div class="bg-[#080d1a]/80 backdrop-blur-2xl border border-indigo-500/20 rounded-[2.5rem] p-10 md:p-14 shadow-[0_0_50px_rgba(79,70,229,0.1)] relative overflow-hidden">
            <div class="scanner-line"></div>

            <!-- 顶部标识 -->
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-black border border-indigo-500/30 rounded-full mx-auto mb-6 flex items-center justify-center shadow-[0_0_20px_rgba(79,70,229,0.2)]">
                    <span class="text-2xl">🛡️</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-black italic hero-font tracking-tighter text-white mb-2">Vetted Access.</h1>
                <p class="text-indigo-400 text-[9px] font-black tracking-[0.3em] uppercase">MyPawTrust Registry Protocol 2026</p>
            </div>

            <!-- 表单区域 -->
            <form class="space-y-6">
                
                <!-- 邮箱输入 -->
                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 uppercase tracking-widest font-black ml-2">Authorized Email</label>
                    <input type="email" placeholder="client@estate.com" class="w-full bg-[#030712] border border-white/10 rounded-2xl px-6 py-4 text-sm text-white placeholder-slate-700 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <!-- 邀请码/身份码输入 -->
                <div class="space-y-2 relative">
                    <label class="text-[10px] text-slate-400 uppercase tracking-widest font-black ml-2">Escrow Identity Code (Optional)</label>
                    <input type="password" placeholder="••••••••••••" class="w-full bg-[#030712] border border-white/10 rounded-2xl px-6 py-4 text-sm text-white placeholder-slate-700 tracking-widest focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <!-- 状态指示 -->
                <div class="flex items-center gap-3 bg-indigo-950/30 p-4 rounded-xl border border-indigo-500/10 mt-4">
                    <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>
                    <span class="text-[9px] text-amber-400/80 uppercase tracking-widest font-bold">System enforcing strict vetting rules. Frivolous inquiries will be rejected.</span>
                </div>

               <button type="button" onclick="location.href='checkout.html'" class="w-full bg-indigo-600 text-white rounded-2xl px-6 py-5 mt-8 text-[11px] font-black uppercase tracking-[0.3em] hover:bg-white hover:text-indigo-900 transition-all shadow-[0_10px_20px_rgba(79,70,229,0.2)] active:scale-[0.98]">
    Initiate Security Clearance
</button>
            </form>

            <!-- 底部条款 -->
            <div class="mt-8 text-center border-t border-white/5 pt-6">
                <a href="#" class="text-[9px] text-slate-500 uppercase tracking-widest hover:text-white transition-colors">Apply for New Registry Status</a>
            </div>

        </div>
    </main>

</body>
</html>
