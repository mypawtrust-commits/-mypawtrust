<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Track Journey | MyPawTrust VIP Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="nav-component.js"></script>
</head>
<body class="bg-[#F8FAFC] text-slate-900 pt-20">
    <main class="max-w-2xl mx-auto px-6 py-24 text-center">
        <h2 class="text-5xl font-black text-indigo-950 italic tracking-tighter mb-4 leading-tight uppercase">VIP Logistics</h2>
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em] mb-12">Official White-Glove Companion Tracking</p>
        
        <div class="bg-white rounded-[3rem] p-10 shadow-2xl border border-slate-100 text-left">
            <label class="block text-[9px] font-black uppercase text-indigo-400 mb-4 ml-2 tracking-widest text-center">Enter 4-Digit Pet Reference</label>
            <div class="flex gap-2">
                <input id="pet_id_input" type="number" placeholder="0000" class="flex-grow p-5 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-600 text-center font-black text-xl">
                <button onclick="performTracking()" class="bg-indigo-950 text-white px-8 rounded-2xl font-black">SEARCH</button>
            </div>
            
            <div id="tracking-content" class="hidden mt-10 space-y-12">
                <div class="border-l-4 border-indigo-600 pl-8">
                    <p id="t_status" class="text-xl font-black text-indigo-900">En Route</p>
                    <p id="t_breed" class="text-sm font-bold text-slate-400 mt-1 uppercase"></p>
                </div>
                <div class="bg-slate-50 p-6 rounded-2xl border border-dashed border-slate-200">
                    <p class="text-[10px] font-black uppercase text-slate-400">Carrier Reference</p>
                    <p id="t_code" class="text-sm font-mono font-black mt-2 text-slate-800 italic underline"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const PROJECT_ID = 'dpnrwrvyixpditytorcf';
        const supabaseUrl = `https://${PROJECT_ID}.supabase.co`;
        const supabaseKey = 'sb_publishable_-depQZkB_gomwvYWa5sYGQ_IfymhyvK';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function performTracking() {
            const id = document.getElementById('pet_id_input').value;
            if(!id) return;
            const { data } = await _supabase.from('pets').select('*').eq('id', id).single();
            if(!data) return alert("System cannot verify this ID yet.");
            
            document.getElementById('t_breed').innerText = data.breed;
            document.getElementById('t_code').innerText = data.shipping_tracking || "ASSINING FLIGHT NANNY...";
            document.getElementById('tracking-content').classList.remove('hidden');
        }
    </script>
</body>
</html>
