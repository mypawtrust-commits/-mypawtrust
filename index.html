<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPawTrust | Premium Pet Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm p-4 flex justify-between items-center max-w-6xl mx-auto rounded-b-2xl">
        <h1 class="text-2xl font-bold text-blue-900 font-sans tracking-tight">🐾 MyPawTrust</h1>
        <button class="bg-orange-500 text-white px-5 py-2 rounded-full font-bold shadow-lg shadow-orange-200 hover:bg-orange-600 transition-all">Apply to Sell</button>
    </nav>

    <!-- 标语区 -->
    <header class="py-12 text-center text-blue-900">
        <h2 class="text-4xl font-extrabold mb-3 tracking-tight">Find Your Perfect Puppy</h2>
        <p class="text-gray-500 font-medium">Ethically Bred • Health Guaranteed • North America Wide</p>
    </header>

    <!-- 宠物展示区 -->
    <main class="max-w-6xl mx-auto p-6">
        <div id="pet-list" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- 加载状态 -->
            <p class="col-span-full py-20 text-center text-gray-500 font-bold animate-pulse text-lg">
                Connecting to MyPawTrust Database...
            </p>
        </div>
    </main>

    <script>
        // --- 核心配置：已修正钥匙空格和URL ---
        const SUPABASE_URL = 'https://dpnrwrvyixpditytorcf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-depQZkB_gomwvYWa5sYGQ_IfymhyvK';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function getPets() {
            try {
                // 从数据库读取数据
                const { data: pets, error } = await _supabase.from('pets').select('*');
                const list = document.getElementById('pet-list');
                
                if (error) { 
                    list.innerHTML = `<p class="col-span-full text-red-500 text-center py-10 font-bold">Database Error: ${error.message}</p>`;
                    return; 
                }
                
                if (!pets || pets.length === 0) { 
                    list.innerHTML = `<div class="col-span-full text-center py-20 bg-white rounded-3xl shadow-inner text-gray-400 font-bold">No pets available right now. Check back soon!</div>`; 
                    return; 
                }

                // 将数据渲染到网页上
                list.innerHTML = pets.map(pet => `
                    <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 hover:scale-105 transition-transform duration-300">
                        <img src="${pet.image_url}" class="w-full h-64 object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=Pet+Image'">
                        <div class="p-6 text-left">
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="text-xl font-bold text-blue-900 tracking-tight">${pet.breed}</h4>
                                <span class="text-orange-500 font-black text-2xl">$${pet.price.toLocaleString()}</span>
                            </div>
                            <p class="text-gray-500 text-sm mb-5 font-semibold">${pet.age} • Verified Healthy</p>
                            <button class="w-full bg-blue-900 text-white py-3 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-800 transition-colors">View Details</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("Critical Error:", e);
                document.getElementById('pet-list').innerHTML = `<p class="col-span-full text-center py-20 text-gray-400">Please refresh your browser.</p>`;
            }
        }
        // 执行函数
        getPets();
    </script>
</body>
</html>
