<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPawTrust | Premium Pet Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white shadow-sm p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-900">🐾 MyPawTrust</h1>
            <div class="space-x-4 text-sm font-bold">
                <a href="#" class="text-gray-600">Browse</a>
                <button class="bg-orange-500 text-white px-4 py-2 rounded-full">Apply to Sell</button>
            </div>
        </div>
    </nav>

    <header class="bg-blue-900 text-white py-12 px-4 text-center">
        <h2 class="text-3xl font-bold mb-2">Find Your Furry Soulmate</h2>
        <p class="text-blue-100">Verified Breeders • Health Guaranteed</p>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div id="pet-list" class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
            <p class="col-span-full py-10">Loading puppies from database...</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://dpnrwrvyixpditytorcf.supabase.co';
        const SUPABASE_ANON_KEY = ' sb_publishable_-depQZkB_gomwvYWa5sYGQ_IfymhyvK
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPets() {
            const { data: pets, error } = await _supabase.from('pets').select('*');
            const list = document.getElementById('pet-list');
            if (error) { list.innerHTML = "Error: " + error.message; return; }
            if (!pets || pets.length === 0) { list.innerHTML = "No pets available yet."; return; }

            list.innerHTML = pets.map(pet => `
                <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 text-left">
                    <img src="${pet.image_url}" class="w-full h-56 object-cover">
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="text-xl font-bold">${pet.breed}</h4>
                            <span class="text-orange-500 font-bold">$${pet.price}</span>
                        </div>
                        <p class="text-gray-500 text-sm mb-4">${pet.age} • ${pet.name || 'Available'}</p>
                        <button class="w-full bg-blue-900 text-white py-2 rounded-xl font-bold hover:bg-blue-800 transition-colors">Details</button>
                    </div>
                </div>
            `).join('');
        }
        fetchPets();
    </script>
</body>
</html>
